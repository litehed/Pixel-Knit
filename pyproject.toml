[project]
name = "pixel-knit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ethan Leitner", email = "57595571+litehed@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pillow>=13.0.0",
    "pyside6>=6.12.0",
]

[project.scripts]
pixel-knit = "pixel_knit.main:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
